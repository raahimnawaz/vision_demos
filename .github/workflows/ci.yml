name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy opencv-python-headless

      - name: Run gesture_bot tests
        # The decision layer, diff-drive kinematics, and serial framing are all
        # pure Python + numpy: no camera, no GPU, and no Arduino needed in CI.
        run: pytest gesture_bot/tests -v

      - name: Run ROS2 wrapper tests (no ROS required)
        # These check the seam between the ROS nodes and the reused modules --
        # chiefly that decision_node's tunable-parameter list still matches
        # ControllerConfig. Renaming a field in decision.py without updating
        # the list would silently stop it being a ROS parameter.
        working-directory: ros2/src/gesture_bot_ros
        env:
          GESTURE_BOT_SRC: ${{ github.workspace }}
        run: pytest test -v
